name: Build Windows installers

on:
  workflow_dispatch:
  push:
    branches:
      - redesign-pink
    paths:
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Build Windows installer and portable ZIP
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LionPocket-Windows-0.2.0
          path: |
            out/make/squirrel.windows/x64/LionPocket-Instalador.exe
            out/make/zip/win32/x64/LionPocket-win32-x64-0.2.0.zip
          if-no-files-found: error
          retention-days: 14
