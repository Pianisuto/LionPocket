name: Release LionPocket

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - package.json
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release-context.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate release version
        id: release-context
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v$package_version"

          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "A tag $GITHUB_REF_NAME não corresponde à versão $package_version do package.json." >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run lint

  prepare-release:
    name: Prepare GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ needs.validate.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - name: Create draft release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG já existe; os artefatos serão atualizados."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "LionPocket $version" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "LionPocket $version" \
              --generate-notes
          fi

  windows:
    name: Build Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable ZIP
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload Windows release assets
        shell: pwsh
        run: |
          $assets = @(
            "out/make/squirrel.windows/x64/LionPocket-Instalador.exe"
            (Get-ChildItem "out/make/squirrel.windows/x64/*.nupkg").FullName
            "out/make/squirrel.windows/x64/RELEASES"
            (Get-ChildItem "out/make/zip/win32/x64/*.zip").FullName
          )

          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset --repo $env:GITHUB_REPOSITORY --clobber
          }

  linux:
    name: Build Linux x64
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux DEB and portable ZIP
        run: npm run make:linux

      - name: Upload Linux release assets
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            out/make/deb/x64/*.deb \
            out/make/zip/linux/x64/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate
      - windows
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}

    steps:
      - name: Download release assets for checksums
        shell: bash
        run: |
          mkdir -p release-files
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-files

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          rm -f release-files/SHA256SUMS.txt
          (
            cd release-files
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload checksums and publish release
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
