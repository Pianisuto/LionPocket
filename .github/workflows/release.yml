name: Release readiness (no publication)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional expected version tag (vX.Y.Z); no tag/release is created
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Linux desktop entry validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: npm run release:validate
      - name: Validate requested tag without shell interpolation
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: node tools/release/validate.cjs "$EXPECTED_TAG"
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run sync:dev:up
      - run: npm run sync:dev:test
      - run: node tools/release/version-skew.cjs
      - if: always()
        run: npm run sync:dev:down
      - run: git diff --check

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        channel: [normal, private-beta]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      LIONPOCKET_BUILD_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace apps/desktop -- --testTimeout=30000 --hookTimeout=30000
      - if: runner.os == 'Windows'
        run: npm run make -- --platform=win32 --arch=x64
      - if: runner.os == 'Linux'
        run: npm run make:linux
      - if: runner.os == 'Windows'
        run: node tools/release/checksums.cjs apps/desktop/out/make .exe .nupkg .zip RELEASES
      - if: runner.os == 'Linux'
        run: node tools/release/checksums.cjs apps/desktop/out/make .deb .zip
      - name: Test real packaged Electron, SQLite, profiles and OS secret store
        if: runner.os == 'Windows'
        run: node tools/release/desktop-smoke.cjs
      - name: Install Squirrel and test the installed application without downloading updates
        if: runner.os == 'Windows'
        run: node tools/release/windows-installer-smoke.cjs
      - name: Windows installed protocol, cold/warm launch, single instance and direct LPV2 confirmation
        if: runner.os == 'Windows'
        run: node tools/pairing/desktop-deeplink-smoke.cjs
      - name: Prepare the packaged SUID helper in the disposable Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$LIONPOCKET_BUILD_CHANNEL" == private-beta ]]; then
            sandbox="apps/desktop/out/LionPocket-Beta-linux-x64/chrome-sandbox"
          else
            sandbox="apps/desktop/out/LionPocket-linux-x64/chrome-sandbox"
          fi
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Test packaged Electron with deliberately unavailable Linux vault
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/release/desktop-smoke.cjs
      - name: Linux installed DEB MIME handler, cold/warm launch and direct LPV2 confirmation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          xvfb-run -a node tools/pairing/desktop-deeplink-smoke.cjs
      # Deliberately no upload-artifact, GH Release or publish step.

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - run: npm run build:core
      - name: Debug (no private credentials)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - name: Missing public signing must fail clearly
        run: node tools/release/android-signing-check.cjs
      - name: Disposable development-signed normal release
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PdevelopmentSigning=true -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - name: Preserve and verify the development candidate separately
        run: node tools/release/android-candidate.cjs normal
      - name: Isolated private beta release
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PprivateBeta=true -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - run: node tools/release/android-candidate.cjs private-beta
      - run: node tools/release/checksums.cjs release-candidates .apk
      - name: Validate external signing with an ephemeral fixture (never production)
        env:
          LIONPOCKET_TEST_SIGNED_APK: /tmp/LionPocket-EPHEMERAL-ONLY.apk
        run: node tools/release/android-signing-fixture.cjs --build
      - name: Build previous normal/beta from the audited base in a disposable checkout
        run: node tools/release/prepare-old-android.cjs
      - name: Prepare synthetic SQLite v1/v4/v5/v8 fixtures
        run: npx tsx tools/release/mobile-fixtures.ts /tmp/lion-release-fixtures-ci
      - name: Enable KVM for the disposable AVD
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK replacements preserve every SQLite record without clearing storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            node tools/release/android-update-ci.cjs
            node tools/pairing/android-deeplink-smoke.cjs
      - name: Require completed native preparation SecretStore evidence
        run: node tools/release/android-secret-store-report.cjs
      # APKs are test candidates; never uploaded or called production signed.
