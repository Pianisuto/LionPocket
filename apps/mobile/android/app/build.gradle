apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // npm workspaces installs React Native and codegen at the monorepo root.
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    // The Hermes compiler is also hoisted to the monorepo node_modules.
    def hermesBinary = org.apache.tools.ant.taskdefs.condition.Os.isFamily("windows") ? "hermesc.exe" : "hermesc"
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/${hermesBinary}").absolutePath
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Metro consumes compiled workspace packages outside the mobile root. Changes
// there must invalidate Gradle's release bundle even when app sources are unchanged.
tasks.configureEach { task ->
    if (task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")) {
        ["core", "sync-protocol", "sync-local"].each { workspace ->
            task.inputs.dir(file("../../../../packages/${workspace}/dist"))
        }
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def privateBeta = project.hasProperty("privateBeta") && project.property("privateBeta") == "true"

// Release identity is supplied externally. Beta/development never consume these credentials.
def developmentSigning = project.findProperty("developmentSigning") == "true"
if (privateBeta && developmentSigning) throw new GradleException("privateBeta already uses development signing; do not combine channels.")
def releaseVersion = new groovy.json.JsonSlurper().parse(file("../../../../tools/release/version.json"))
def signingProperties = new Properties()
def signingFile = System.getenv("LIONPOCKET_ANDROID_SIGNING_FILE")
if (!privateBeta && !developmentSigning && signingFile) {
    def externalFile = new File(signingFile)
    if (!externalFile.isAbsolute() || !externalFile.isFile()) throw new GradleException("LIONPOCKET_ANDROID_SIGNING_FILE must point to an existing external absolute path.")
    externalFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { name -> signingProperties.getProperty(name) ?: System.getenv("LIONPOCKET_ANDROID_" + name.replaceAll(/([a-z])([A-Z])/, '$1_$2').toUpperCase()) }
def signingNames = ["storeFile", "storePassword", "keyAlias", "keyPassword", "certificateSha256"]
def productionConfigured = !privateBeta && !developmentSigning && signingNames.every { signingValue(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.lionpocketmobile"
    defaultConfig {
        applicationId privateBeta ? "com.lionpocketmobile.beta" : "com.lionpocketmobile"
        buildConfigField "boolean", "PRIVATE_BETA", "${privateBeta}"
        buildConfigField "String", "BETA_ENDPOINT", privateBeta ? '"https://sync-beta.lionslab.dev"' : '""'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders += [appAuthRedirectScheme: privateBeta ? 'com.lionpocketmobile.beta' : 'com.lionpocketmobile.syncdev', appDisplayName: privateBeta ? 'LionPocket Beta' : 'LionPocket']
        versionCode releaseVersion.androidVersionCode
        versionName releaseVersion.version
    }
    signingConfigs {
        if (productionConfigured) {
            production {
                storeFile new File(signingValue("storeFile"))
                storePassword signingValue("storePassword")
                keyAlias signingValue("keyAlias")
                keyPassword signingValue("keyPassword")
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig ((privateBeta || developmentSigning) ? signingConfigs.debug : (productionConfigured ? signingConfigs.production : null))
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Fail before bundling/packaging. No credential values are included in errors.
def validateReleaseIdentity = tasks.register("validateReleaseIdentity") {
    doLast {
        if (privateBeta || developmentSigning) return
        if (!productionConfigured) throw new GradleException("Production signing required. Set external LIONPOCKET_ANDROID_SIGNING_FILE or LIONPOCKET_ANDROID_* variables. For disposable local tests only, use -PdevelopmentSigning=true. See docs/local-first-sync-release-readiness.md.")
        def store = new File(signingValue("storeFile"))
        if (!store.isAbsolute() || !store.isFile()) throw new GradleException("Production keystore must be an existing absolute external path.")
        def checkout = file("../../../..").canonicalFile.toPath()
        if (store.canonicalFile.toPath().startsWith(checkout)) throw new GradleException("Production keystore must be outside the checkout.")
        try {
            def keys = java.security.KeyStore.getInstance(store, signingValue("storePassword").toCharArray())
            def certificate = keys.getCertificate(signingValue("keyAlias"))
            def digest = java.security.MessageDigest.getInstance("SHA-256").digest(certificate.encoded).encodeHex().toString()
            def expected = signingValue("certificateSha256").toLowerCase().replace(":", "")
            if (!(expected ==~ /[0-9a-f]{64}/) || digest != expected || digest == "fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c" || certificate.subjectX500Principal.name.contains("CN=Android Debug"))
                throw new GradleException("Invalid production signing identity.")
        } catch (Exception ignored) {
            throw new GradleException("Production signing identity could not be verified. Check external keystore, alias, passwords and certificateSha256. Development certificates are refused.")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") task.dependsOn(validateReleaseIdentity)
}
