name: ${COMPOSE_PROJECT_NAME:-lionpocket-sync}
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    entrypoint: [/bin/sh, /opt/lionpocket/postgres-start.sh]
    environment:
      POSTGRES_USER: postgres
    secrets: [postgres_password, sync_password, auth_password]
    volumes:
      - ./postgres-start.sh:/opt/lionpocket/postgres-start.sh:ro
      - database:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-lionpocket.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 40
  keycloak:
    user: "${LP_UID:-1000}:0"
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    restart: unless-stopped
    entrypoint: [/bin/bash, /opt/lionpocket/keycloak-start.sh]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/lion_auth
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://${AUTH_HOST:?set AUTH_HOST}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: lp-admin
    secrets: [auth_password, admin_password]
    volumes:
      - ./keycloak-start.sh:/opt/lionpocket/keycloak-start.sh:ro
      - ./realm.json:/opt/keycloak/data/import/lionpocket-realm.json:ro
      - ../keycloak-theme/lionpocket:/opt/keycloak/themes/lionpocket:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 60
  api:
    user: "${LP_UID:-1000}:0"
    image: lionpocket-sync:${LP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile
    restart: unless-stopped
    environment:
      SYNC_DB_HOST: postgres
      SYNC_DB_NAME: lion_sync
      SYNC_DB_USER: sync_api
      SYNC_DB_PASSWORD_FILE: /run/secrets/sync_password
      SYNC_PUBLIC_ORIGIN: https://${SYNC_HOST:?set SYNC_HOST}
      SYNC_OIDC_ISSUER: https://${AUTH_HOST:?set AUTH_HOST}/realms/lionpocket
    secrets: [sync_password]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/v1/environment').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 40
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    profiles: [https]
    restart: unless-stopped
    environment:
      SYNC_HOST: ${SYNC_HOST}
      AUTH_HOST: ${AUTH_HOST}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    depends_on: [api, keycloak]
  operator:
    user: "${LP_UID:-1000}:0"
    image: lionpocket-sync:${LP_IMAGE_TAG:-local}
    profiles: [operations]
    entrypoint: [node, /opt/lionpocket/operator.mjs]
    environment:
      AUTH_HOST: ${AUTH_HOST}
      SYNC_HOST: ${SYNC_HOST}
    secrets: [admin_password]
    volumes: ['./operator.mjs:/opt/lionpocket/operator.mjs:ro']
secrets:
  postgres_password: {file: '${POSTGRES_PASSWORD_FILE:?set external password path}'}
  sync_password: {file: '${SYNC_DB_PASSWORD_FILE:?set external password path}'}
  auth_password: {file: '${AUTH_DB_PASSWORD_FILE:?set external password path}'}
  admin_password: {file: '${KEYCLOAK_ADMIN_PASSWORD_FILE:?set external password path}'}
volumes:
  database:
  certificates:
  caddy-config:
